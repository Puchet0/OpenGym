name: opengym

services:
  # One-time: download the exercise images + GIFs into ./media (skipped if already there).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC).
  # One-time: download the exercise images + GIFs into a named volume (shared with `web`).
  # ~140 MB, from github.com/hasaneyldrm/exercises-dataset (CC). A named volume (not a ./ bind
  # mount) is used so the download survives per-service volume isolation — e.g. in Coolify, where
  # each service gets its own bind mount and `media` writing to ./media/img would not be visible
  # to `web` reading from its own ./media/img. With a named volume both read/write the same place.
  media:
    image: alpine/git
    volumes:
      - media_img:/out/img
      - media_gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  # Passkey auth + per-user data (Node, no framework).
  # image: prebuilt (docker compose pull). build: from source (docker compose up --build).
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      # ── Core (Coolify 4.3 reads ${VAR} from the compose and pre-fills the env panel as
      #    editable values; the :-default keeps a sane local fallback. Nothing is hard-baked.) ──
      PORT: "3000"            # internal port (nginx proxies here) — do not change
      DATA_DIR: /data
      COACH_CODEX_HOME: /codex
      RP_ID: ${RP_ID:-localhost}
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      RP_NAME: ${RP_NAME:-openGym}
      # ── AI Coach via self-hosted OmniRoute gateway (OpenAI-compatible /v1/chat/completions) ──
      # The container reaches the gateway by its LAN address, not localhost (localhost = the
      # container itself). OMNIROUTE_API_KEY has no default so it is NOT baked into the file;
      # set it as an editable (and secret) variable in the Coolify panel. It is also settable
      # in the admin dashboard (AI Coach → Add API key).
      OMNIROUTE_BASE_URL: ${OMNIROUTE_BASE_URL:-http://192.168.1.207:20128}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-nvidia/nvidia/nemotron-3-super-120b-a12b}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      ADMIN_UIDS: ${ADMIN_UIDS:-Puchet}
      COACH_DISABLED: ${COACH_DISABLED:-false}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
      # ChatGPT/Codex refresh tokens are kept separate from app data and mounted only into the
      # API container. This directory is owned by the unprivileged Coach runtime.
      - ./data/codex:/codex

  # Builds the React frontend (multi-stage) and serves it, proxying /api → api
  # and the exercise media from the shared volume. Single origin for passkeys.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    # WEB_PORT is exposed here so Coolify lists it as an editable variable. The host port the
    # stack publishes is "${WEB_PORT}:80" (nginx inside the container is always on 80).
    environment:
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media_img:/usr/share/nginx/html/img:ro
      - media_gif:/usr/share/nginx/html/gif:ro

volumes:
  media_img:
  media_gif:
